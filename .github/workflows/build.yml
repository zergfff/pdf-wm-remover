name: Build Windows Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI (release)
        run: cargo build --release --no-default-features --features cli

      - name: Build GUI (release)
        run: cargo build --release --no-default-features --features gui

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/pdf-wm-remover.exe dist/
          cp target/release/pdf-wm-remover-gui.exe dist/
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-wm-remover-windows-${{ matrix.target }}
          path: dist/

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true